<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Крестики-Нолики | Неон-стиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
            transition: all 0.4s ease;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* ===== ВСЕ СТИЛИ ===== */
        body.cyber-style { background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0a0a0a 100%); }
        body.cyber-style::before { background-image: repeating-linear-gradient(0deg, rgba(255, 0, 255, 0.1) 0px, rgba(255, 0, 255, 0.1) 2px, transparent 2px, transparent 8px), repeating-linear-gradient(90deg, rgba(0, 255, 255, 0.1) 0px, rgba(0, 255, 255, 0.1) 2px, transparent 2px, transparent 8px); }
        body.space-style { background: radial-gradient(ellipse at 30% 40%, #0a0a2a, #000010); }
        body.space-style::before { background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 80px 150px, #ff0, transparent), radial-gradient(3px 3px at 200px 400px, #0ff, transparent); background-size: 300px 300px; background-repeat: no-repeat; animation: starsMove 40s linear infinite; }
        @keyframes starsMove { 0% { background-position: 0 0, 0 0, 0 0; } 100% { background-position: 300px 300px, -100px 200px, 200px -100px; } }
        body.medieval-style { background: linear-gradient(145deg, #2a2418 0%, #1a1510 100%); }
        body.medieval-style::before { background-image: repeating-linear-gradient(45deg, rgba(80, 60, 40, 0.3) 0px, rgba(80, 60, 40, 0.3) 2px, transparent 2px, transparent 12px); }
        body.ocean-style { background: linear-gradient(135deg, #003366 0%, #006699 50%, #003366 100%); }
        body.ocean-style::before { background: repeating-linear-gradient(90deg, rgba(100, 200, 255, 0.15) 0px, rgba(100, 200, 255, 0.15) 2px, transparent 2px, transparent 50px); animation: waveMove 2s linear infinite; }
        @keyframes waveMove { 0% { transform: translateX(0); } 100% { transform: translateX(50px); } }
        body.sakura-style { background: linear-gradient(135deg, #2a0a2a 0%, #4a1a4a 50%, #2a0a2a 100%); }
        body.ice-style { background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8c 50%, #1a3a5c 100%); }
        body.apocalypse-style { background: linear-gradient(135deg, #3a2a1a 0%, #5a4a2a 50%, #3a2a1a 100%); }
        body.casino-style { background: linear-gradient(135deg, #1a1a2a 0%, #2a2a4a 50%, #1a1a2a 100%); }
        body.halloween-style { background: linear-gradient(135deg, #1a0a0a 0%, #3a1a1a 50%, #1a0a0a 100%); }
        body.dark-mode { background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000); }
        body.dark-mode::before { opacity: 0.2; }

        .game-container {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.15);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.8em;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #8a2be2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .mode-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            color: #0ff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Orbitron', monospace;
            touch-action: manipulation;
        }

        .mode-btn:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.96);
        }

        .mode-btn.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 20px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: rgba(20, 20, 50, 0.8);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #0ff;
            touch-action: manipulation;
        }

        .cell:active {
            transform: scale(0.96);
            background: rgba(0, 255, 255, 0.2);
        }

        .win-line {
            position: absolute;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            border-radius: 5px;
            z-index: 10;
            box-shadow: 0 0 15px #ff00ff;
        }

        .status {
            font-size: 1.1em;
            color: #0ff;
            margin: 15px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
        }

        button {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: bold;
            color: #0ff;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
            font-family: 'Orbitron', monospace;
            touch-action: manipulation;
        }

        button:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.96);
        }

        @media (max-width: 480px) {
            .game-container { padding: 15px; }
            .cell { font-size: 2.8em; }
            h1 { font-size: 1.4em; }
            .mode-btn { padding: 6px 15px; font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>❌ КРЕСТИКИ-НОЛИКИ ⭕</h1>
        
        <div class="mode-buttons">
            <button class="mode-btn" id="modeFriend">👥 С ДРУГОМ</button>
            <button class="mode-btn" id="modeBot">🤖 С БОТОМ</button>
        </div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="status" id="status">Ход: ❌</div>
        
        <button id="resetBtn">🔄 НОВАЯ ИГРА</button>
        <button onclick="window.location.href='index.html'">🏠 В МЕНЮ</button>
    </div>

    <script>
        // ПРИМЕНЯЕМ СОХРАНЁННЫЙ СТИЛЬ
        const savedStyle = localStorage.getItem('globalStyle');
        if (savedStyle) {
            document.body.classList.add(savedStyle);
        }

        let soundEnabled = true;
        let audioContext = null;

        if (localStorage.getItem('soundEnabled') !== null) {
            soundEnabled = localStorage.getItem('soundEnabled') === 'true';
        }

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playMoveSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 660;
                gainNode.gain.value = 0.1;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15);
                oscillator.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function playWinSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const notes = [523, 659, 784];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = freq;
                        gain.gain.value = 0.15;
                        osc.type = 'sine';
                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                        osc.stop(ctx.currentTime + 0.3);
                    }, i * 150);
                });
            } catch(e) {}
        }

        function playDrawSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 440;
                gainNode.gain.value = 0.12;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.4);
                oscillator.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        function playLoseSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 330;
                gainNode.gain.value = 0.15;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                oscillator.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'soundEnabled') {
                soundEnabled = e.newValue === 'true';
            }
            if (e.key === 'globalStyle') {
                const newStyle = e.newValue;
                if (newStyle) {
                    document.body.classList.remove(...document.body.classList);
                    document.body.classList.add(newStyle);
                }
            }
        });

        const cells = document.querySelectorAll('.cell');
        const statusDiv = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const modeFriendBtn = document.getElementById('modeFriend');
        const modeBotBtn = document.getElementById('modeBot');
        const boardDiv = document.getElementById('board');
        
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let isBotMode = false;
        let winLine = null;
        
        const winPatterns = [
            { indices: [0, 1, 2], direction: 'horizontal', row: 0 },
            { indices: [3, 4, 5], direction: 'horizontal', row: 1 },
            { indices: [6, 7, 8], direction: 'horizontal', row: 2 },
            { indices: [0, 3, 6], direction: 'vertical', col: 0 },
            { indices: [1, 4, 7], direction: 'vertical', col: 1 },
            { indices: [2, 5, 8], direction: 'vertical', col: 2 },
            { indices: [0, 4, 8], direction: 'diagonal', type: 'main' },
            { indices: [2, 4, 6], direction: 'diagonal', type: 'anti' }
        ];
        
        function drawWinLine(pattern) {
            removeWinLine();
            
            const cellsRect = cells[0].getBoundingClientRect();
            const boardRect = boardDiv.getBoundingClientRect();
            const cellSize = cellsRect.width;
            const gap = 8;
            
            const line = document.createElement('div');
            line.className = 'win-line';
            
            let left, top, width, height;
            
            if (pattern.direction === 'horizontal') {
                const row = pattern.row;
                left = cellsRect.left - boardRect.left - gap/2;
                top = cellsRect.top - boardRect.top + (row * (cellSize + gap)) + cellSize/2 - 4;
                width = cellSize * 3 + gap * 2;
                height = 6;
            } 
            else if (pattern.direction === 'vertical') {
                const col = pattern.col;
                left = cellsRect.left - boardRect.left + (col * (cellSize + gap)) + cellSize/2 - 3;
                top = cellsRect.top - boardRect.top - gap/2;
                width = 6;
                height = cellSize * 3 + gap * 2;
            }
            else {
                if (pattern.type === 'main') {
                    const startX = cellsRect.left - boardRect.left - gap/2;
                    const startY = cellsRect.top - boardRect.top - gap/2;
                    const endX = startX + cellSize * 3 + gap * 2;
                    const endY = startY + cellSize * 3 + gap * 2;
                    left = startX;
                    top = startY;
                    width = Math.hypot(endX - startX, endY - startY);
                    height = 6;
                    line.style.transform = `rotate(${Math.atan2(endY - startY, endX - startX)}rad)`;
                    line.style.transformOrigin = '0 0';
                } else {
                    const startX = cellsRect.left - boardRect.left + cellSize * 3 + gap * 2 - gap/2;
                    const startY = cellsRect.top - boardRect.top - gap/2;
                    const endX = startX - (cellSize * 3 + gap * 2);
                    const endY = startY + (cellSize * 3 + gap * 2);
                    left = startX;
                    top = startY;
                    width = Math.hypot(endX - startX, endY - startY);
                    height = 6;
                    line.style.transform = `rotate(${Math.atan2(endY - startY, endX - startX)}rad)`;
                    line.style.transformOrigin = '0 0';
                }
            }
            
            line.style.left = left + 'px';
            line.style.top = top + 'px';
            line.style.width = width + 'px';
            line.style.height = height + 'px';
            
            boardDiv.style.position = 'relative';
            boardDiv.appendChild(line);
            winLine = line;
        }
        
        function removeWinLine() {
            if (winLine) {
                winLine.remove();
                winLine = null;
            }
        }
        
        function checkWinner() {
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern.indices;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameActive = false;
                    drawWinLine(pattern);
                    
                    const winner = board[a];
                    
                    if (winner === 'X') {
                        if (isBotMode) {
                            playWinSound();
                        } else {
                            playWinSound();
                        }
                    } else {
                        if (isBotMode) {
                            playLoseSound();
                        } else {
                            playWinSound();
                        }
                    }
                    
                    statusDiv.innerHTML = `🏆 ПОБЕДИЛ: ${winner === 'X' ? '❌' : '⭕'}! 🏆`;
                    return true;
                }
            }
            
            if (board.every(cell => cell !== '')) {
                gameActive = false;
                playDrawSound();
                statusDiv.innerHTML = "🤝 НИЧЬЯ! 🤝";
                return true;
            }
            return false;
        }
        
        function updateStatus() {
            if (gameActive) {
                statusDiv.innerHTML = `Ход: ${currentPlayer === 'X' ? '❌' : '⭕'}`;
            }
        }
        
        function makeMove(index, player) {
            if (!gameActive) return false;
            if (board[index] !== '') return false;
            if (currentPlayer !== player) return false;
            
            board[index] = currentPlayer;
            cells[index].textContent = currentPlayer === 'X' ? '❌' : '⭕';
            cells[index].style.color = currentPlayer === 'X' ? '#0ff' : '#f0f';
            playMoveSound();
            
            if (checkWinner()) return true;
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
            return true;
        }
        
        function getAvailableMoves() {
            return board.reduce((acc, cell, idx) => {
                if (cell === '') acc.push(idx);
                return acc;
            }, []);
        }
        
        function checkWinningMove(player) {
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern.indices;
                const values = [board[a], board[b], board[c]];
                const countPlayer = values.filter(v => v === player).length;
                const countEmpty = values.filter(v => v === '').length;
                
                if (countPlayer === 2 && countEmpty === 1) {
                    if (board[a] === '') return a;
                    if (board[b] === '') return b;
                    if (board[c] === '') return c;
                }
            }
            return null;
        }
        
        function botMove() {
            if (!gameActive) return;
            if (currentPlayer !== 'O') return;
            
            setTimeout(() => {
                if (!gameActive || currentPlayer !== 'O') return;
                
                let move = null;
                move = checkWinningMove('O');
                if (move === null) move = checkWinningMove('X');
                if (move === null && board[4] === '') move = 4;
                
                const corners = [0, 2, 6, 8];
                if (move === null) {
                    const availableCorners = corners.filter(i => board[i] === '');
                    if (availableCorners.length > 0) {
                        move = availableCorners[Math.floor(Math.random() * availableCorners.length)];
                    }
                }
                
                if (move === null) {
                    const available = getAvailableMoves();
                    if (available.length > 0) {
                        move = available[Math.floor(Math.random() * available.length)];
                    }
                }
                
                if (move !== null) {
                    makeMove(move, 'O');
                }
            }, 200);
        }
        
        function handleCellClick(index) {
            if (isBotMode && currentPlayer === 'O') return;
            if (makeMove(index, currentPlayer)) {
                if (isBotMode && gameActive && currentPlayer === 'O') {
                    botMove();
                }
            }
        }
        
        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            removeWinLine();
            cells.forEach(cell => {
                cell.textContent = '';
            });
            statusDiv.innerHTML = 'Ход: ❌';
        }
        
        function setModeFriend() {
            isBotMode = false;
            modeFriendBtn.classList.add('active');
            modeBotBtn.classList.remove('active');
            resetGame();
        }
        
        function setModeBot() {
            isBotMode = true;
            modeBotBtn.classList.add('active');
            modeFriendBtn.classList.remove('active');
            resetGame();
        }
        
        cells.forEach((cell, index) => {
            cell.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleCellClick(index);
            });
            cell.addEventListener('click', () => handleCellClick(index));
        });
        
        resetBtn.addEventListener('click', resetGame);
        modeFriendBtn.addEventListener('click', setModeFriend);
        modeBotBtn.addEventListener('click', setModeBot);
        
        setModeFriend();
    </script>
</body>
</html>
