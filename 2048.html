<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 | Неон-стиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }

        body {
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 10px;
            transition: all 0.4s ease;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* ===== ВСЕ СТИЛИ ===== */
        body.cyber-style { background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0a0a0a 100%); }
        body.cyber-style::before { background-image: repeating-linear-gradient(0deg, rgba(255, 0, 255, 0.1) 0px, rgba(255, 0, 255, 0.1) 2px, transparent 2px, transparent 8px), repeating-linear-gradient(90deg, rgba(0, 255, 255, 0.1) 0px, rgba(0, 255, 255, 0.1) 2px, transparent 2px, transparent 8px); }
        body.space-style { background: radial-gradient(ellipse at 30% 40%, #0a0a2a, #000010); }
        body.space-style::before { background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 80px 150px, #ff0, transparent), radial-gradient(3px 3px at 200px 400px, #0ff, transparent); background-size: 300px 300px; background-repeat: no-repeat; animation: starsMove 40s linear infinite; }
        @keyframes starsMove { 0% { background-position: 0 0, 0 0, 0 0; } 100% { background-position: 300px 300px, -100px 200px, 200px -100px; } }
        body.medieval-style { background: linear-gradient(145deg, #2a2418 0%, #1a1510 100%); }
        body.medieval-style::before { background-image: repeating-linear-gradient(45deg, rgba(80, 60, 40, 0.3) 0px, rgba(80, 60, 40, 0.3) 2px, transparent 2px, transparent 12px); }
        body.ocean-style { background: linear-gradient(135deg, #003366 0%, #006699 50%, #003366 100%); }
        body.ocean-style::before { background: repeating-linear-gradient(90deg, rgba(100, 200, 255, 0.15) 0px, rgba(100, 200, 255, 0.15) 2px, transparent 2px, transparent 50px); animation: waveMove 2s linear infinite; }
        @keyframes waveMove { 0% { transform: translateX(0); } 100% { transform: translateX(50px); } }
        body.sakura-style { background: linear-gradient(135deg, #2a0a2a 0%, #4a1a4a 50%, #2a0a2a 100%); }
        body.ice-style { background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8c 50%, #1a3a5c 100%); }
        body.apocalypse-style { background: linear-gradient(135deg, #3a2a1a 0%, #5a4a2a 50%, #3a2a1a 100%); }
        body.casino-style { background: linear-gradient(135deg, #1a1a2a 0%, #2a2a4a 50%, #1a1a2a 100%); }
        body.halloween-style { background: linear-gradient(135deg, #1a0a0a 0%, #3a1a1a 50%, #1a0a0a 100%); }
        body.dark-mode { background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000); }
        body.dark-mode::before { opacity: 0.2; }

        .game-wrapper {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.15);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 100%;
            height: auto;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.4);
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-box {
            color: #0ff;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .score-box span {
            color: #ff00ff;
            font-size: 1.5em;
        }

        button {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.8em;
            font-weight: bold;
            color: #0ff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Orbitron', monospace;
            touch-action: manipulation;
        }

        button:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.96);
        }

        .status {
            color: #0ff;
            font-size: 0.8em;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }

        .controls-hint {
            text-align: center;
            margin-top: 8px;
            color: rgba(0, 255, 255, 0.5);
            font-size: 0.6em;
        }

        @media (max-width: 550px) {
            .game-wrapper { padding: 10px; }
            .score-box { font-size: 1em; }
            button { padding: 6px 12px; font-size: 0.7em; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="450" height="450"></canvas>
        <div class="info-panel">
            <div class="score-box">СЧЁТ: <span id="score">0</span></div>
            <div class="score-box">ЛУЧШИЙ: <span id="bestScore">0</span></div>
            <button id="restartBtn">🔄 НОВАЯ</button>
            <button onclick="window.location.href='index.html'">🏠 МЕНЮ</button>
        </div>
        <div class="status" id="status">2048 | СОБЕРИТЕ 2048</div>
        <div class="controls-hint">⬆️⬇️⬅️➡️ | W A S D | СВАЙПЫ ПАЛЬЦЕМ</div>
    </div>

    <script>
        // ПРИМЕНЯЕМ СОХРАНЁННЫЙ СТИЛЬ
        const savedStyle = localStorage.getItem('globalStyle');
        if (savedStyle) {
            document.body.classList.add(savedStyle);
        }

        let soundEnabled = true;
        let audioContext = null;

        if (localStorage.getItem('soundEnabled') !== null) {
            soundEnabled = localStorage.getItem('soundEnabled') === 'true';
        }

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playMergeSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 660;
                gainNode.gain.value = 0.1;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.12);
                oscillator.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        function playWinSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const notes = [523, 659, 784];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = freq;
                        gain.gain.value = 0.15;
                        osc.type = 'sine';
                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                        osc.stop(ctx.currentTime + 0.3);
                    }, i * 150);
                });
            } catch(e) {}
        }

        function playGameOverSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 330;
                gainNode.gain.value = 0.15;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                oscillator.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'soundEnabled') {
                soundEnabled = e.newValue === 'true';
            }
            if (e.key === 'globalStyle') {
                const newStyle = e.newValue;
                if (newStyle) {
                    document.body.classList.remove(...document.body.classList);
                    document.body.classList.add(newStyle);
                }
            }
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const bestScoreSpan = document.getElementById('bestScore');
        const statusDiv = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');

        const SIZE = 4;
        const CELL_SIZE = 105;
        const OFFSET = 15;
        
        let grid = [];
        let score = 0;
        let bestScore = localStorage.getItem('2048BestScore') || 0;
        let gameRunning = true;
        let winAchieved = false;

        bestScoreSpan.textContent = bestScore;

        function initGrid() {
            grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            addRandomTile();
            addRandomTile();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 0) emptyCells.push({x: i, y: j});
                }
            }
            if (emptyCells.length > 0) {
                const random = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[random.x][random.y] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function move(direction) {
            if (!gameRunning) return false;
            
            let moved = false;
            let newGrid = JSON.parse(JSON.stringify(grid));
            let pointsEarned = 0;
            
            if (direction === 'left') {
                for (let i = 0; i < SIZE; i++) {
                    let row = newGrid[i].filter(v => v !== 0);
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            pointsEarned += row[j];
                            row[j + 1] = 0;
                            playMergeSound();
                        }
                    }
                    row = row.filter(v => v !== 0);
                    while (row.length < SIZE) row.push(0);
                    if (JSON.stringify(newGrid[i]) !== JSON.stringify(row)) moved = true;
                    newGrid[i] = row;
                }
            }
            else if (direction === 'right') {
                for (let i = 0; i < SIZE; i++) {
                    let row = newGrid[i].filter(v => v !== 0);
                    for (let j = row.length - 1; j > 0; j--) {
                        if (row[j] === row[j - 1]) {
                            row[j] *= 2;
                            pointsEarned += row[j];
                            row[j - 1] = 0;
                            playMergeSound();
                        }
                    }
                    row = row.filter(v => v !== 0);
                    while (row.length < SIZE) row.unshift(0);
                    if (JSON.stringify(newGrid[i]) !== JSON.stringify(row)) moved = true;
                    newGrid[i] = row;
                }
            }
            else if (direction === 'up') {
                for (let j = 0; j < SIZE; j++) {
                    let col = [];
                    for (let i = 0; i < SIZE; i++) {
                        if (newGrid[i][j] !== 0) col.push(newGrid[i][j]);
                    }
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            pointsEarned += col[i];
                            col[i + 1] = 0;
                            playMergeSound();
                        }
                    }
                    col = col.filter(v => v !== 0);
                    while (col.length < SIZE) col.push(0);
                    for (let i = 0; i < SIZE; i++) {
                        if (newGrid[i][j] !== col[i]) moved = true;
                        newGrid[i][j] = col[i];
                    }
                }
            }
            else if (direction === 'down') {
                for (let j = 0; j < SIZE; j++) {
                    let col = [];
                    for (let i = 0; i < SIZE; i++) {
                        if (newGrid[i][j] !== 0) col.push(newGrid[i][j]);
                    }
                    for (let i = col.length - 1; i > 0; i--) {
                        if (col[i] === col[i - 1]) {
                            col[i] *= 2;
                            pointsEarned += col[i];
                            col[i - 1] = 0;
                            playMergeSound();
                        }
                    }
                    col = col.filter(v => v !== 0);
                    while (col.length < SIZE) col.unshift(0);
                    for (let i = 0; i < SIZE; i++) {
                        if (newGrid[i][j] !== col[i]) moved = true;
                        newGrid[i][j] = col[i];
                    }
                }
            }
            
            if (moved) {
                grid = newGrid;
                score += pointsEarned;
                addRandomTile();
                scoreSpan.textContent = score;
                if (score > bestScore) {
                    bestScore = score;
                    bestScoreSpan.textContent = bestScore;
                    localStorage.setItem('2048BestScore', bestScore);
                }
                draw();
                checkWin();
                checkGameOver();
                return true;
            }
            return false;
        }

        function checkWin() {
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 2048 && !winAchieved) {
                        winAchieved = true;
                        playWinSound();
                        statusDiv.innerHTML = '🏆 ПОЗДРАВЛЯЮ! ВЫ НАБРАЛИ 2048! 🏆';
                        statusDiv.style.color = '#ff00ff';
                    }
                }
            }
        }

        function checkGameOver() {
            let canMove = false;
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 0) canMove = true;
                    if (j < SIZE - 1 && grid[i][j] === grid[i][j + 1]) canMove = true;
                    if (i < SIZE - 1 && grid[i][j] === grid[i + 1][j]) canMove = true;
                }
            }
            if (!canMove && gameRunning) {
                gameRunning = false;
                playGameOverSound();
                statusDiv.innerHTML = '💀 ИГРА ОКОНЧЕНА! НАЖМИТЕ "НОВАЯ" 💀';
                statusDiv.style.color = '#f0f';
            }
        }

        function resetGame() {
            grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            score = 0;
            winAchieved = false;
            gameRunning = true;
            scoreSpan.textContent = '0';
            statusDiv.innerHTML = '2048 | СОБЕРИТЕ 2048';
            statusDiv.style.color = '#0ff';
            addRandomTile();
            addRandomTile();
            draw();
        }

        function getColor(value) {
            const colors = {
                0: '#0a0a2a',
                2: '#0ff',
                4: '#0f8',
                8: '#ff0',
                16: '#f80',
                32: '#f60',
                64: '#f40',
                128: '#f0f',
                256: '#c0f',
                512: '#90f',
                1024: '#60f',
                2048: '#ff00ff'
            };
            return colors[value] || '#fff';
        }

        function draw() {
            ctx.clearRect(0, 0, 450, 450);
            
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const value = grid[i][j];
                    const x = j * CELL_SIZE + OFFSET;
                    const y = i * CELL_SIZE + OFFSET;
                    
                    ctx.fillStyle = getColor(value);
                    ctx.shadowBlur = value > 0 ? 8 : 0;
                    ctx.shadowColor = getColor(value);
                    ctx.fillRect(x, y, CELL_SIZE - 2, CELL_SIZE - 2);
                    ctx.shadowBlur = 0;
                    
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                    ctx.strokeRect(x, y, CELL_SIZE - 2, CELL_SIZE - 2);
                    
                    if (value > 0) {
                        ctx.font = `bold ${value >= 100 ? 24 : 32}px 'Orbitron', monospace`;
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = '#0ff';
                        ctx.fillText(value, x + CELL_SIZE / 2 - 20, y + CELL_SIZE / 2 + 10);
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function handleMove(direction) {
            if (!gameRunning) return;
            move(direction);
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') handleMove('up');
            else if (key === 'ArrowDown' || key === 's' || key === 'S') handleMove('down');
            else if (key === 'ArrowLeft' || key === 'a' || key === 'A') handleMove('left');
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') handleMove('right');
            else return;
            e.preventDefault();
        });

        let touchStart = { x: 0, y: 0 };
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            touchStart = {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchEnd = {
                x: e.changedTouches[0].clientX - rect.left,
                y: e.changedTouches[0].clientY - rect.top
            };
            const dx = touchEnd.x - touchStart.x;
            const dy = touchEnd.y - touchStart.y;
            
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
                if (dx > 0) handleMove('right');
                else handleMove('left');
            } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) {
                if (dy > 0) handleMove('down');
                else handleMove('up');
            }
            touchStart = { x: 0, y: 0 };
        });

        restartBtn.addEventListener('click', () => {
            resetGame();
            gameRunning = true;
        });

        initGrid();
        draw();
    </script>
</body>
</html>
