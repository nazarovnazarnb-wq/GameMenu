<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Змейка | Неон-стиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 10px;
            transition: all 0.4s ease;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* ===== ВСЕ СТИЛИ ===== */
        body.cyber-style { background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0a0a0a 100%); }
        body.cyber-style::before { background-image: repeating-linear-gradient(0deg, rgba(255, 0, 255, 0.1) 0px, rgba(255, 0, 255, 0.1) 2px, transparent 2px, transparent 8px), repeating-linear-gradient(90deg, rgba(0, 255, 255, 0.1) 0px, rgba(0, 255, 255, 0.1) 2px, transparent 2px, transparent 8px); }
        body.space-style { background: radial-gradient(ellipse at 30% 40%, #0a0a2a, #000010); }
        body.space-style::before { background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 80px 150px, #ff0, transparent), radial-gradient(3px 3px at 200px 400px, #0ff, transparent); background-size: 300px 300px; background-repeat: no-repeat; animation: starsMove 40s linear infinite; }
        @keyframes starsMove { 0% { background-position: 0 0, 0 0, 0 0; } 100% { background-position: 300px 300px, -100px 200px, 200px -100px; } }
        body.medieval-style { background: linear-gradient(145deg, #2a2418 0%, #1a1510 100%); }
        body.medieval-style::before { background-image: repeating-linear-gradient(45deg, rgba(80, 60, 40, 0.3) 0px, rgba(80, 60, 40, 0.3) 2px, transparent 2px, transparent 12px); }
        body.ocean-style { background: linear-gradient(135deg, #003366 0%, #006699 50%, #003366 100%); }
        body.ocean-style::before { background: repeating-linear-gradient(90deg, rgba(100, 200, 255, 0.15) 0px, rgba(100, 200, 255, 0.15) 2px, transparent 2px, transparent 50px); animation: waveMove 2s linear infinite; }
        @keyframes waveMove { 0% { transform: translateX(0); } 100% { transform: translateX(50px); } }
        body.sakura-style { background: linear-gradient(135deg, #2a0a2a 0%, #4a1a4a 50%, #2a0a2a 100%); }
        body.ice-style { background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8c 50%, #1a3a5c 100%); }
        body.apocalypse-style { background: linear-gradient(135deg, #3a2a1a 0%, #5a4a2a 50%, #3a2a1a 100%); }
        body.casino-style { background: linear-gradient(135deg, #1a1a2a 0%, #2a2a4a 50%, #1a1a2a 100%); }
        body.halloween-style { background: linear-gradient(135deg, #1a0a0a 0%, #3a1a1a 50%, #1a0a0a 100%); }
        body.dark-mode { background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000); }
        body.dark-mode::before { opacity: 0.2; }

        .game-wrapper {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.15);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 100%;
            height: auto;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.4);
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-box {
            color: #0ff;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .score-box span {
            color: #ff00ff;
            font-size: 1.5em;
        }

        button {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.8em;
            font-weight: bold;
            color: #0ff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Orbitron', monospace;
            touch-action: manipulation;
        }

        button:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.96);
        }

        .status {
            color: #0ff;
            font-size: 0.8em;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }

        .touch-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .touch-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .touch-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #0ff;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Orbitron', monospace;
            text-align: center;
            min-width: 65px;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.96);
        }

        .controls-hint {
            text-align: center;
            margin-top: 8px;
            color: rgba(0, 255, 255, 0.5);
            font-size: 0.6em;
        }

        @media (max-width: 550px) {
            .game-wrapper { padding: 10px; }
            .score-box { font-size: 1em; }
            button { padding: 6px 12px; font-size: 0.7em; }
            .touch-btn { padding: 10px 16px; font-size: 1.1em; min-width: 55px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="info-panel">
            <div class="score-box">СЧЁТ: <span id="score">0</span></div>
            <div class="score-box">РЕКОРД: <span id="highScore">0</span></div>
            <button id="restartBtn">🔄 НОВАЯ</button>
            <button onclick="window.location.href='index.html'">🏠 МЕНЮ</button>
        </div>
        <div class="status" id="status">⬆️⬇️⬅️➡️ УПРАВЛЕНИЕ</div>
        
        <div class="touch-controls">
            <div class="touch-row">
                <div class="touch-btn" id="upBtn">▲</div>
            </div>
            <div class="touch-row">
                <div class="touch-btn" id="leftBtn">◀</div>
                <div class="touch-btn" id="downBtn">▼</div>
                <div class="touch-btn" id="rightBtn">▶</div>
            </div>
        </div>
        <div class="controls-hint">← → / A D | ↑ ↓ / W S | СЕНСОРНЫЕ КНОПКИ</div>
    </div>

    <script>
        // ПРИМЕНЯЕМ СОХРАНЁННЫЙ СТИЛЬ
        const savedStyle = localStorage.getItem('globalStyle');
        if (savedStyle) {
            document.body.classList.add(savedStyle);
        }

        let soundEnabled = true;
        let audioContext = null;

        if (localStorage.getItem('soundEnabled') !== null) {
            soundEnabled = localStorage.getItem('soundEnabled') === 'true';
        }

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playEatSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 660;
                gainNode.gain.value = 0.12;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15);
                oscillator.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function playGameOverSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 330;
                gainNode.gain.value = 0.15;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                oscillator.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'soundEnabled') {
                soundEnabled = e.newValue === 'true';
            }
            if (e.key === 'globalStyle') {
                const newStyle = e.newValue;
                if (newStyle) {
                    document.body.classList.remove(...document.body.classList);
                    document.body.classList.add(newStyle);
                }
            }
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const highScoreSpan = document.getElementById('highScore');
        const statusDiv = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');

        const SIZE = 20;
        const W = 25;
        const H = 25;

        let snake = [{x: 12, y: 12}];
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let food = {x: 15, y: 12};
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = true;
        let gameLoopInterval = null;

        highScoreSpan.textContent = highScore;

        function randomFood() {
            const newFood = {
                x: Math.floor(Math.random() * W),
                y: Math.floor(Math.random() * H)
            };
            for (let segment of snake) {
                if (segment.x === newFood.x && segment.y === newFood.y) {
                    return randomFood();
                }
            }
            return newFood;
        }

        function update() {
            if (!gameRunning) return;

            direction = {...nextDirection};

            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (newHead.x < 0 || newHead.x >= W || newHead.y < 0 || newHead.y >= H) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (segment.x === newHead.x && segment.y === newHead.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                score++;
                scoreSpan.textContent = score;
                playEatSound();
                food = randomFood();
                
                if (score > highScore) {
                    highScore = score;
                    highScoreSpan.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameRunning = false;
            playGameOverSound();
            statusDiv.innerHTML = '💀 ИГРА ОКОНЧЕНА! НАЖМИТЕ "НОВАЯ" 💀';
            statusDiv.style.color = '#f0f';
            if (gameLoopInterval) clearInterval(gameLoopInterval);
        }

        function resetGame() {
            snake = [{x: 12, y: 12}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            scoreSpan.textContent = '0';
            gameRunning = true;
            food = randomFood();
            statusDiv.innerHTML = '⬆️⬇️⬅️➡️ УПРАВЛЕНИЕ';
            statusDiv.style.color = '#0ff';
            
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(update, 120);
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, 500, 500);
            
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= W; i++) {
                ctx.beginPath();
                ctx.moveTo(i * SIZE, 0);
                ctx.lineTo(i * SIZE, 500);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * SIZE);
                ctx.lineTo(500, i * SIZE);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#ff00ff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff00ff';
            ctx.fillRect(food.x * SIZE, food.y * SIZE, SIZE - 1, SIZE - 1);
            
            for (let i = 0; i < snake.length; i++) {
                const grad = ctx.createLinearGradient(
                    snake[i].x * SIZE, snake[i].y * SIZE,
                    snake[i].x * SIZE + SIZE, snake[i].y * SIZE + SIZE
                );
                grad.addColorStop(0, '#0ff');
                grad.addColorStop(1, '#0a8');
                ctx.fillStyle = grad;
                ctx.fillRect(snake[i].x * SIZE, snake[i].y * SIZE, SIZE - 1, SIZE - 1);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(snake[i].x * SIZE, snake[i].y * SIZE, SIZE - 1, SIZE - 1);
            }
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(snake[0].x * SIZE + SIZE * 0.7, snake[0].y * SIZE + SIZE * 0.3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(snake[0].x * SIZE + SIZE * 0.3, snake[0].y * SIZE + SIZE * 0.3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(snake[0].x * SIZE + SIZE * 0.7, snake[0].y * SIZE + SIZE * 0.3, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(snake[0].x * SIZE + SIZE * 0.3, snake[0].y * SIZE + SIZE * 0.3, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function changeDirection(newDir) {
            if (!gameRunning) return;
            if ((newDir.x === -direction.x && newDir.y === -direction.y)) return;
            nextDirection = newDir;
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp') changeDirection({x: 0, y: -1});
            else if (key === 'ArrowDown') changeDirection({x: 0, y: 1});
            else if (key === 'ArrowLeft') changeDirection({x: -1, y: 0});
            else if (key === 'ArrowRight') changeDirection({x: 1, y: 0});
            else if (key === 'w' || key === 'W') changeDirection({x: 0, y: -1});
            else if (key === 's' || key === 'S') changeDirection({x: 0, y: 1});
            else if (key === 'a' || key === 'A') changeDirection({x: -1, y: 0});
            else if (key === 'd' || key === 'D') changeDirection({x: 1, y: 0});
            else return;
            e.preventDefault();
        });

        document.getElementById('upBtn').addEventListener('click', () => changeDirection({x: 0, y: -1}));
        document.getElementById('downBtn').addEventListener('click', () => changeDirection({x: 0, y: 1}));
        document.getElementById('leftBtn').addEventListener('click', () => changeDirection({x: -1, y: 0}));
        document.getElementById('rightBtn').addEventListener('click', () => changeDirection({x: 1, y: 0}));

        restartBtn.addEventListener('click', resetGame);

        resetGame();
        draw();
    </script>
</body>
</html>
